name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        working-directory: frontend
      - name: Build web app
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://https-github-com-azzam200022-azo.onrender.com' }}
      - name: Add Android platform
        run: npx cap add android
        working-directory: frontend
      - name: Enable Android session cookies
        run: |
          mkdir -p frontend/android/app/src/main/java/com/azzam200022/azo
          cp frontend/android-override/MainActivity.java frontend/android/app/src/main/java/com/azzam200022/azo/MainActivity.java
          cp frontend/android-override/BackgroundTrackingPlugin.java frontend/android/app/src/main/java/com/azzam200022/azo/BackgroundTrackingPlugin.java
          cp frontend/android-override/BackgroundLocationService.java frontend/android/app/src/main/java/com/azzam200022/azo/BackgroundLocationService.java
          cp frontend/android-override/LocationQueueDatabase.java frontend/android/app/src/main/java/com/azzam200022/azo/LocationQueueDatabase.java
      - name: Configure Firebase Android app
        working-directory: frontend
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -z "$FIREBASE_GOOGLE_SERVICES_JSON" ]]; then
            echo "::warning::Firebase Android configuration is missing; FCM registration will not work in this APK."
          else
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync("android/app/google-services.json","utf8"));const clients=data.client||[];if(!clients.some((client)=>client.client_info?.android_client_info?.package_name==="com.azzam200022.azo")){console.error("Firebase config does not contain package com.azzam200022.azo");process.exit(1)}'
          fi
      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: frontend
      - name: Apply AZO launcher icons
        run: cp -R android-override/res/. android/app/src/main/res/
        working-directory: frontend
      - name: Set Android version and signing config
        run: python3 android-override/configure-gradle.py
        working-directory: frontend
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      - name: Validate release signing with temporary key
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair -noprompt -v \
            -keystore "$RUNNER_TEMP/ci-release-test.jks" \
            -storepass ci-test-only -keypass ci-test-only \
            -alias ci-release-test -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android CI Test"
          trap 'rm -f "$RUNNER_TEMP/ci-release-test.jks"' EXIT
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ci-release-test.jks" \
          ANDROID_KEYSTORE_PASSWORD=ci-test-only \
          ANDROID_KEY_ALIAS=ci-release-test \
          ANDROID_KEY_PASSWORD=ci-test-only \
            ./gradlew assembleRelease --no-daemon
        working-directory: frontend/android
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing required repository secret: ${secret_name}"
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/azo-release.jks"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          unset ANDROID_KEYSTORE_BASE64
          ANDROID_KEYSTORE_FILE="$keystore_path" ./gradlew assembleRelease --no-daemon
        working-directory: frontend/android
      - name: Save debug APK artifact
        if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Save signed release APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: release-assets
      - name: Name release APK
        run: mv release-assets/app-release.apk "release-assets/azo-${GITHUB_REF_NAME}.apk"
      - name: Publish permanent GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "release-assets/azo-${GITHUB_REF_NAME}.apk" --title "AZO $GITHUB_REF_NAME" --generate-notes --verify-tag
